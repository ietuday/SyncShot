name: Real media qualification smoke
on:
  pull_request:
    paths:
      - 'scripts/qualify-real-media-low-memory.sh'
      - 'scripts/preflight-real-media.py'
      - 'scripts/test-preflight-real-media.py'
      - 'scripts/smoke-qualify-real-media.sh'
      - 'scripts/smoke-qualification-failure.sh'
      - 'scripts/check-low-memory-benchmark.py'
      - 'scripts/check-av-sync.py'
      - 'scripts/summarize-real-media-qualification.py'
      - '.github/workflows/real-media-qualification.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Real-media preflight regression tests
        run: python3 scripts/test-preflight-real-media.py
      - name: Qualification wrapper end-to-end smoke
        run: bash scripts/smoke-qualify-real-media.sh
      - name: Qualification failed-memory-gate regression
        run: bash scripts/smoke-qualification-failure.sh
