name: Audio transcription unit checks
on:
  pull_request:
    paths:
      - 'scripts/transcribe-audio.py'
      - 'scripts/test-transcribe-audio.py'
      - '.github/workflows/audio-transcription.yml'
  workflow_dispatch:

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate transcription JSON and timestamp handling
        run: python3 scripts/test-transcribe-audio.py
