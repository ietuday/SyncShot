name: Publish original SyncShot and Studio to GitHub Pages
on:
  push:
    branches: [feature/studio-foundation]
    paths: ['studio/**', '.github/workflows/studio-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Studio source
        uses: actions/checkout@v4
      - name: Check out preserved original Pages site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: original-pages
          persist-credentials: false
      - name: Verify original website files
        run: |
          test -s original-pages/index.html
          test -s original-pages/demo.js
          test -s original-pages/studio.css
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: node --test test/*.test.mjs
        working-directory: studio
      - name: Validate Node API syntax
        run: node --check server.mjs && node --check uploads.mjs && node --check timeline-contract.js
        working-directory: studio
      - name: Build separate Studio application
        run: npm run build
        working-directory: studio
        env:
          VITE_DEMO_MODE: 'true'
      - name: Assemble original homepage and isolated Studio
        run: |
          mkdir -p pages/studio
          cp original-pages/index.html original-pages/demo.js original-pages/studio.css pages/
          touch pages/.nojekyll
          cp -a studio/dist/. pages/studio/
          test -s pages/index.html
          test -s pages/demo.js
          test -s pages/studio/index.html
          test -s pages/studio/angular/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
