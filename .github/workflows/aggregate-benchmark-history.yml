name: Aggregate benchmark history
on:
  pull_request:
    paths:
      - '.github/workflows/aggregate-benchmark-history.yml'
      - 'scripts/summarize-benchmark-history.py'
      - 'scripts/test-benchmark-history.py'
      - 'scripts/extract-benchmark-evidence.py'
      - 'scripts/test-extract-benchmark-evidence.py'
  workflow_dispatch:
    inputs:
      run_ids:
        description: 'Comma-separated completed paired qualification workflow run IDs'
        required: false
        type: string
      require_attestation:
        description: 'Require verified GitHub provenance for every archived benchmark run'
        required: false
        type: boolean
        default: false
      require_audit_metadata:
        description: 'Require versioned audit metadata and GitHub run identity'
        required: false
        type: boolean
        default: false
      verify_evidence_sha256:
        description: 'Verify archived qualification reports against SHA-256 checksums'
        required: false
        type: boolean
        default: false
      require_matching_inputs:
        description: 'Reject differing qualification media input fingerprints'
        required: false
        type: boolean
        default: false
      require_matching_environment:
        description: 'Reject missing or mismatched runner/config provenance'
        required: false
        type: boolean
        default: false
      require_workload_id:
        description: 'Optional workload ID required for every comparison'
        required: false
        type: string
      min_repetitions:
        description: 'Minimum runs per side for alert eligibility'
        required: false
        default: '1'
        type: choice
        options: ['1', '2', '3']
      alert_threshold_percent:
        description: 'Regression alert threshold percentage (0-10000)'
        required: false
        default: '200'
        type: string
      latest_count:
        description: 'When run_ids is empty, collect latest successful runs'
        required: false
        default: '5'
        type: choice
        options: ['1', '3', '5', '10', '20']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate history summarizer
        run: |
          python3 scripts/test-benchmark-history.py
          python3 scripts/test-extract-benchmark-evidence.py
  history:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download selected benchmark evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: ${{ inputs.run_ids }}
          LATEST_COUNT: ${{ inputs.latest_count || '5' }}
          GH_REPO: ${{ github.repository }}
          REQUIRE_ATTESTATION: ${{ inputs.require_attestation || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p history-input
          if [ -n "${RUN_IDS//[[:space:],]/}" ]; then
            IFS=',' read -ra IDS <<< "$RUN_IDS"
          else
            [[ "$LATEST_COUNT" =~ ^[0-9]+$ ]] && (( LATEST_COUNT >= 1 && LATEST_COUNT <= 20 )) || exit 1
            mapfile -t ALL_IDS < <(gh api "repos/$GH_REPO/actions/workflows/paired-qualification-comparison.yml/runs?status=success&per_page=100" --jq '.workflow_runs[].id')
            IDS=()
            for id in "${ALL_IDS[@]}"; do
              if [ "$REQUIRE_ATTESTATION" = "true" ]; then artifact_name="attested-paired-qualification-evidence"; else artifact_name="paired-qualification-evidence"; fi
              available="$(gh api "repos/$GH_REPO/actions/runs/$id/artifacts" --jq '.artifacts[] | select(.expired == false) | .name' | grep -Fxc "$artifact_name" || true)"
              if [[ "$available" -gt 0 ]]; then IDS+=("$id"); fi
              if (( ${#IDS[@]} >= LATEST_COUNT )); then break; fi
            done
            (( ${#IDS[@]} > 0 )) || { echo "No eligible benchmark artifacts found"; exit 1; }
          fi
          (( ${#IDS[@]} > 0 && ${#IDS[@]} <= 20 )) || { echo 'Select 1-20 runs'; exit 1; }
          for raw_id in "${IDS[@]}"; do
            id="$(echo "$raw_id" | xargs)"
            [[ "$id" =~ ^[0-9]+$ ]] || { echo "Invalid workflow run ID"; exit 1; }
            mkdir -p "history-input/run-$id"
            if [ "$REQUIRE_ATTESTATION" = "true" ]; then
              mkdir -p "attested-download/run-$id"
              gh run download "$id" --repo "$GH_REPO" --name attested-paired-qualification-evidence --dir "attested-download/run-$id"
              archive="attested-download/run-$id/paired-qualification-evidence.tar.gz"
              test -f "$archive"
              gh attestation verify "$archive" --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/paired-qualification-comparison.yml"
              python3 scripts/extract-benchmark-evidence.py "$archive" "history-input/run-$id"
            else
              gh run download "$id" --repo "$GH_REPO" --name paired-qualification-evidence --dir "history-input/run-$id"
            fi
            test -f "history-input/run-$id/run-manifest.json"
            test -f "history-input/run-$id/paired-performance-comparison.json"
          done
      - name: Generate historical comparison summary
        env:
          ALERT_THRESHOLD: ${{ inputs.alert_threshold_percent || '200' }}
          REQUIRED_WORKLOAD: ${{ inputs.require_workload_id || '' }}
          MIN_REPETITIONS: ${{ inputs.min_repetitions || '1' }}
          REQUIRE_ENVIRONMENT: ${{ inputs.require_matching_environment || 'false' }}
          REQUIRE_INPUTS: ${{ inputs.require_matching_inputs || 'false' }}
          VERIFY_CHECKSUMS: ${{ inputs.verify_evidence_sha256 || 'false' }}
          REQUIRE_AUDIT: ${{ inputs.require_audit_metadata || 'false' }}
        run: |
          args=(--output-dir benchmark-history --alert-threshold-percent "$ALERT_THRESHOLD" --min-repetitions "$MIN_REPETITIONS")
          if [ -n "$REQUIRED_WORKLOAD" ]; then args+=(--require-workload-id "$REQUIRED_WORKLOAD"); fi
          if [ "$REQUIRE_ENVIRONMENT" = "true" ]; then args+=(--require-matching-environment); fi
          if [ "$REQUIRE_INPUTS" = "true" ]; then args+=(--require-matching-inputs); fi
          if [ "$VERIFY_CHECKSUMS" = "true" ]; then args+=(--verify-evidence-sha256); fi
          if [ "$REQUIRE_AUDIT" = "true" ]; then args+=(--require-audit-metadata); fi
          python3 scripts/summarize-benchmark-history.py history-input/run-* "${args[@]}"
      - name: Show history summary
        if: always()
        run: |
          if [ -f benchmark-history/history.md ]; then cat benchmark-history/history.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f benchmark-history/regression-alerts.md ]; then cat benchmark-history/regression-alerts.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload history results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregated-benchmark-history
          path: benchmark-history/
          if-no-files-found: warn
          retention-days: 14
