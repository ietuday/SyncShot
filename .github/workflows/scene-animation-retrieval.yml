name: Scene animation retrieval tests
on:
  pull_request:
    paths:
      - 'scripts/retrieve-animation-clips.py'
      - 'scripts/test-retrieve-animation-clips.py'
      - '.github/workflows/scene-animation-retrieval.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-retrieve-animation-clips.py
