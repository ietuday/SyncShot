name: Real provider pilot preflight checks
on:
  pull_request:
    paths:
      - 'scripts/check-provider-pilot.py'
      - 'scripts/test-check-provider-pilot.py'
      - '.github/workflows/provider-pilot-readiness.yml'
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-check-provider-pilot.py
