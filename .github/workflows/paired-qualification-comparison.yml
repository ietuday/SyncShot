name: Paired production qualification comparison
on:
  pull_request:
    paths:
      - '.github/workflows/paired-qualification-comparison.yml'
      - 'scripts/test-paired-qualification-e2e.py'
      - 'scripts/compare-benchmarks.py'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Optional full 40-character baseline commit SHA (manual runs only)'
        required: false
        type: string
        default: ''
      repetitions:
        description: 'Runs per side (1-3; default keeps CI fast)'
        required: false
        type: choice
        options: ['1', '2', '3']
        default: '1'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned baseline revision
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.baseline_sha != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline_sha }}
          path: baseline-source
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Check Python syntax
        run: python3 -m py_compile scripts/test-paired-qualification-e2e.py
      - name: Run paired complete qualification and comparison
        env:
          SYNC_SHOT_BENCHMARK_EVIDENCE_DIR: paired-qualification-evidence
          SYNC_SHOT_QUALIFICATION_REPETITIONS: ${{ inputs.repetitions || '1' }}
          SYNC_SHOT_BASELINE_SHA: ${{ inputs.baseline_sha || '' }}
          SYNC_SHOT_BASELINE_CHECKOUT: ${{ inputs.baseline_sha && 'baseline-source' || '' }}
        run: python3 scripts/test-paired-qualification-e2e.py
      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f paired-qualification-evidence/performance-summary.md ]; then
            cat paired-qualification-evidence/performance-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paired-qualification-evidence
          path: paired-qualification-evidence/
          if-no-files-found: warn
          retention-days: 14

  attest:
    name: Attest benchmark evidence archive
    if: github.event_name == 'workflow_dispatch'
    needs: compare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download benchmark evidence from this run
        uses: actions/download-artifact@v4
        with:
          name: paired-qualification-evidence
          path: paired-qualification-evidence
      - name: Create deterministic evidence archive
        run: |
          test -f paired-qualification-evidence/run-manifest.json
          test -f paired-qualification-evidence/paired-performance-comparison.json
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -czf paired-qualification-evidence.tar.gz paired-qualification-evidence
      - name: Attest archive provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: paired-qualification-evidence.tar.gz
      - name: Upload attested archive
        uses: actions/upload-artifact@v4
        with:
          name: attested-paired-qualification-evidence
          path: paired-qualification-evidence.tar.gz
          retention-days: 14
