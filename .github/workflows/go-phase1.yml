name: Go Phase 1 checks
on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/**'
      - '.github/workflows/go-phase1.yml'
      - '.github/workflows/release.yml'
  push:
    branches: [syncshot-go, feature/enhanced-video-pipeline]
jobs:
  go:
    runs-on: ubuntu-24.04
    container:
      image: jrottenberg/ffmpeg:7.1-ubuntu2404
      volumes:
        - /etc/ssl/certs:/etc/ssl/certs:ro
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify bundled FFmpeg
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Check benchmark script syntax
        run: bash -n scripts/benchmark-long-video.sh scripts/verify-benchmark-output.sh scripts/test-benchmark-output.sh
      - name: Validate medium qualification script syntax
        run: bash -n scripts/test-medium-video-qualification.sh
      - name: Production qualification script syntax
        run: bash -n scripts/qualify-production-media.sh
      - name: Benchmark output regression tests
        run: bash scripts/test-benchmark-output.sh
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/syncshot
      - name: Full CLI cancellation smoke test
        timeout-minutes: 8
        run: bash scripts/cancel-smoke-test.sh
      - name: FFmpeg end-to-end smoke test
        timeout-minutes: 8
        run: bash scripts/smoke-test.sh

  race:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmark summary tests
        run: python3 scripts/test-summarize-benchmarks.py -v
      - name: Benchmark comparison tests
        run: python3 scripts/test-compare-benchmarks.py -v
      - name: Input fingerprint regression tests
        run: python3 scripts/test-fingerprint-inputs.py -v
      - name: Subtitle cue timing tests
        run: python3 scripts/test-subtitle-cue-timing.py -v
      - name: Shorts visual regression tests
        run: python3 scripts/test-shorts-visual-content.py -v
      - name: Race detector (without FFmpeg integration)
        run: go test -short -race ./...

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Validate benchmark smoke script syntax
        run: bash -n scripts/test-benchmark-runner-e2e.sh
      - name: Real FFmpeg benchmark runner integration test
        timeout-minutes: 10
        env:
          SYNC_SHOT_BENCHMARK_EVIDENCE_DIR: benchmark-evidence
        run: bash scripts/test-benchmark-runner-e2e.sh
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-evidence
          path: benchmark-evidence/
          if-no-files-found: warn
          retention-days: 14
