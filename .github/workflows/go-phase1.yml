name: Go Phase 1 checks
on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'scripts/**'
      - '.github/workflows/go-phase1.yml'
  push:
    branches: [feature/enhanced-video-pipeline]
jobs:
  go:
    runs-on: ubuntu-24.04
    container:
      image: jrottenberg/ffmpeg:7.1-ubuntu2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify bundled FFmpeg
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Unit tests
        run: go test ./...
      - name: Race detector
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/syncshot
      - name: Full CLI cancellation smoke test
        timeout-minutes: 8
        run: bash scripts/cancel-smoke-test.sh
      - name: FFmpeg end-to-end smoke test
        timeout-minutes: 8
        run: bash scripts/smoke-test.sh
