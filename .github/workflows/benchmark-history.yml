name: Benchmark history report tests
on:
  pull_request:
    paths:
      - 'scripts/summarize-benchmark-history.py'
      - 'scripts/test-benchmark-history.py'
      - '.github/workflows/benchmark-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate historical reporting
        run: python3 scripts/test-benchmark-history.py
