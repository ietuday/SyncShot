name: Pilot audio preparation checks
on:
  pull_request:
    paths:
      - 'scripts/prepare-pilot-audio.py'
      - 'scripts/test-prepare-pilot-audio.py'
      - '.github/workflows/pilot-audio.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-prepare-pilot-audio.py
