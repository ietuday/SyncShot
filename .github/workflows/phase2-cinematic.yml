name: Phase 2 cinematic checks
on:
  push:
    branches: [feature/phase2-cinematic-rendering]
  pull_request:
    paths:
      - 'internal/cinematic/**'
      - 'internal/stages/cinematic.go'
      - 'internal/pipeline/**'
      - '.github/workflows/phase2-cinematic.yml'
jobs:
  cinematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Ensure FFmpeg
        timeout-minutes: 12
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            # GitHub hosted Ubuntu runners can use a very slow Azure mirror.
            # Select the official mirror and refresh indexes before installing.
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' /etc/apt/sources.list 2>/dev/null || true
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends ffmpeg
          fi
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Unit and rendering tests
        run: go test -count=1 ./...
      - name: Race checks
        run: go test -race ./internal/cinematic ./internal/pipeline
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/syncshot
