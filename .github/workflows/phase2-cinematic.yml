name: Phase 2 cinematic checks
on:
  push:
    branches: [feature/phase2-cinematic-rendering]
  pull_request:
    paths:
      - 'internal/cinematic/**'
      - 'internal/stages/cinematic.go'
      - 'internal/pipeline/**'
      - '.github/workflows/phase2-cinematic.yml'
jobs:
  cinematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install FFmpeg from static release
        timeout-minutes: 3
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            curl --fail --location --retry 2 --connect-timeout 10 --max-time 90 \
              https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz \
              -o /tmp/ffmpeg.tar.xz
            mkdir -p /tmp/ffmpeg-static
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-static --strip-components=1
            echo "/tmp/ffmpeg-static" >> "$GITHUB_PATH"
            export PATH="/tmp/ffmpeg-static:$PATH"
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Unit and rendering tests
        run: go test -count=1 ./...
      - name: Race checks
        run: go test -race ./internal/cinematic ./internal/pipeline
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/syncshot
