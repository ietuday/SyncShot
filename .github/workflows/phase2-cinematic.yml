name: Phase 2 cinematic checks
on:
  push:
    branches: [feature/phase2-cinematic-rendering]
  pull_request:
    paths:
      - 'internal/cinematic/**'
      - 'internal/stages/cinematic.go'
      - 'internal/pipeline/**'
      - '.github/workflows/phase2-cinematic.yml'
jobs:
  cinematic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check FFmpeg
        timeout-minutes: 2
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            echo 'FFmpeg unavailable on runner; installing with bounded timeout'
            sudo timeout 90s apt-get update -qq
            sudo timeout 90s apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Unit and rendering tests
        run: go test -count=1 ./...
      - name: Race checks
        run: go test -race ./internal/cinematic ./internal/pipeline
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/syncshot
