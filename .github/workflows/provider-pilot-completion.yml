name: Existing provider pilot completion checks
on:
  pull_request:
    paths:
      - 'scripts/complete-provider-pilot.py'
      - 'scripts/test-complete-provider-pilot.py'
      - '.github/workflows/provider-pilot-completion.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-complete-provider-pilot.py
