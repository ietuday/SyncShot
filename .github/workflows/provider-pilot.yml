name: One-scene provider pilot checks
on:
  pull_request:
    paths:
      - 'scripts/prepare-provider-pilot.py'
      - 'scripts/test-prepare-provider-pilot.py'
      - '.github/workflows/provider-pilot.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-prepare-provider-pilot.py
