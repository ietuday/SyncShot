name: Scene animation adapter checks
on:
  pull_request:
    paths:
      - 'scripts/animate-scene-images.py'
      - 'scripts/test-animate-scene-images.py'
      - '.github/workflows/scene-animation.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/test-animate-scene-images.py
