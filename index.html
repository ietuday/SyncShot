<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SyncShot Studio Demo</title>
  <link rel="stylesheet" href="./studio.css?v=position-1">
  <script src="./demo.js?v=position-1" type="module"></script>
</head>
<body>
  <main>
    <nav><strong>SyncShot</strong><a href="https://github.com/ietuday/SyncShot/tree/feature/studio-foundation/studio#run-locally">Run the full Studio</a></nav>
    <section>
      <h1>Video studio demo</h1>
      <p>Try the scene planner with the sample story, or select your own audio and photos. Files stay in your browser. Export a WebM here, or run Studio locally for MP4 and automatic captions.</p>
      <fieldset id="inputs">
        <label>Narration <input id="audio" type="file" accept="audio/*"></label>
        <label>Photos <input id="photos" type="file" accept="image/*" multiple></label>
        <ol id="photo-order" class="photo-order" aria-label="Photo order" hidden></ol>
        <label>Photo motion
          <select id="motion">
            <option value="static">None</option>
            <option value="zoom-in">Zoom in</option>
            <option value="zoom-out">Zoom out</option>
          </select>
        </label>
        <label>Transition
          <select id="transition">
            <option value="cut">Cut</option>
            <option value="fade">Crossfade</option>
          </select>
        </label>
        <label>Video format
          <select id="format">
            <option value="landscape">Landscape · 16:9</option>
            <option value="portrait">Portrait · 9:16</option>
            <option value="square">Square · 1:1</option>
          </select>
        </label>
        <label>Photo framing
          <select id="framing">
            <option value="contain">Fit · show the whole photo</option>
            <option value="cover">Fill · crop to the frame</option>
          </select>
        </label>
        <label id="crop-control" hidden>Crop position
          <select id="crop-position">
            <option value="0.5,0.5">Center</option>
            <option value="0.5,0">Top</option>
            <option value="0.5,1">Bottom</option>
            <option value="0,0.5">Left</option>
            <option value="1,0.5">Right</option>
            <option value="0,0">Top left</option>
            <option value="1,0">Top right</option>
            <option value="0,1">Bottom left</option>
            <option value="1,1">Bottom right</option>
          </select>
        </label>
        <label>Scene pacing
          <select id="pacing">
            <option value="auto">By photo count</option>
            <option value="8">About 8 seconds per scene</option>
            <option value="15">About 15 seconds per scene</option>
            <option value="30">About 30 seconds per scene</option>
          </select>
        </label>
        <label>Subtitles (.srt)
          <input id="captions" type="file" accept=".srt">
        </label>
        <div class="actions">
          <button type="button" id="sample-captions">Use sample captions</button>
        </div>
        <p id="caption-status" role="status">Subtitles off.</p>
      </fieldset>
      <div class="actions">
        <button id="plan">Plan scenes</button>
        <button id="preview">Preview 10 seconds</button>
        <button id="export">Export WebM</button>
      </div>
      <div id="export-result" hidden>
        <video id="export-video" controls preload="metadata" aria-label="Exported video"></video>
        <a id="download" download="syncshot.webm">Download WebM</a>
      </div>
      <p id="status" role="status"></p>
      <figure id="player" hidden>
        <div id="frame"></div>
        <figcaption id="time"></figcaption>
      </figure>
      <div class="scene-plan">
        <table hidden>
          <thead><tr><th scope="col">Scene</th><th scope="col">Start</th><th scope="col">End</th><th scope="col">Photo</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
